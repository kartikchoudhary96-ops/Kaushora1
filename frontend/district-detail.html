<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>District Detail — Kaushora</title>
  <link rel="stylesheet" href="css/design.css" />
</head>
<body data-page="districts">
  <div id="shell"></div>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script>
    (function () {
      "use strict";
      const page = document.getElementById("page");
      const id = new URLSearchParams(window.location.search).get("id") || "";
      async function load() {
        page.innerHTML = '<a href="districts.html" class="btn ghost sm">← All districts</a><div class="card" style="margin-top:14px"><div class="skel" style="height:220px"></div></div>';
        if (!id) { page.innerHTML = window.KShell.emptyState("No district selected", "Return to Districts and choose one once records exist."); return; }
        try {
          const d = await window.KaushoraAPI.district(id);
          render(d);
        } catch (e) {
          page.innerHTML = '<a href="districts.html" class="btn ghost sm">← All districts</a><div style="margin-top:14px">' +
            window.KShell.emptyState("District not found", "No district record exists for “" + esc(id) + "”. " + esc(e.message || "")) + "</div>";
        }
      }
      function render(d) {
        const x = d.district || d;
        page.innerHTML = '<a href="districts.html" class="btn ghost sm">← All districts</a>' +
          "<h1 class='title' style='margin-top:14px'>" + esc(x.district || id) + "</h1>" +
          '<p class="subtitle">' + esc(x.state || "") + " · Priority: " + esc(x.priority_level || "—") + "</p>" +
          '<div class="grid cols-3">' +
          metric("Training demand", x.estimated_training_demand) + metric("Annual capacity", x.annual_training_capacity) + metric("Capacity gap", d.capacity_gap) +
          '</div><div class="evidence-strip" style="margin-top:16px">' + window.KIcon("shield") + '<div>' + esc(d.note || "") + '</div></div>' +
          '<div class="grid cols-2" style="margin-top:16px"><div class="card"><div class="eyebrow">Training footprint</div><h3>' + (d.summary || {}).training_centres + ' centres</h3>' +
          table((d.training_centres || []), ["centre_name", "annual_capacity", "current_enrollment"], ["Centre", "Capacity", "Enrolled"]) +
          '</div><div class="card"><div class="eyebrow">Placement outcomes</div><h3>' + ((d.summary || {}).placement_rate == null ? "—" : (d.summary || {}).placement_rate + "%") + ' average rate</h3>' +
          table((d.placements || []).slice(0, 6), ["course_name", "training_year", "placement_rate"], ["Course", "Year", "Placed"]) + '</div></div>' +
          '<div class="card" style="margin-top:16px"><div class="eyebrow">Recent job postings</div><h3>' + (d.summary || {}).job_postings + ' records in this district</h3>' +
          table((d.job_postings || []), ["job_title", "sector", "posting_date"], ["Role", "Sector", "Posted"]) + '</div>';
      }
      function metric(label, value) { return '<div class="card kpi"><div class="k-label">' + esc(label) + '</div><div class="k-value">' + (value == null ? "—" : esc(value)) + '</div></div>'; }
      function table(rows, keys, labels) {
        if (!rows.length) return '<p class="hint">No records available.</p>';
        return '<div class="table-wrap"><table class="data" style="min-width:0"><thead><tr>' + labels.map((x) => '<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + keys.map((k) => '<td>' + esc(r[k] == null ? "—" : r[k]) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      }
      function esc(s) { return window.KShell.escapeHtml(s); }
      load();
    })();
  </script>
</body>
</html>
