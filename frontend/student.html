<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Student Dashboard — Kaushora</title>
  <link rel="stylesheet" href="css/design.css" />
  <style>
    .profile-header{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
    .profile-header .avatar{ width:56px; height:56px; border-radius:50%; background:var(--pistachio); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; }
    .career-card{ border-left:4px solid var(--pistachio); }
    .gap-bar{ height:8px; border-radius:99px; background:#eee7d2; overflow:hidden; }
    .gap-bar i{ display:block; height:100%; background:var(--pistachio-deep); }
    .next-action{ display:flex; gap:10px; padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
    .next-action .num{ width:28px; height:28px; border-radius:50%; background:var(--pistachio); display:flex; align-items:center; justify-content:center; font-weight:700; flex:0 0 28px; }
  </style>
</head>
<body data-page="student">
  <div id="shell"></div>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script>
  (function(){
    "use strict";
    const page=document.getElementById("page");
    const pid=new URLSearchParams(location.search).get("id");
    let profile=null, analysis=null, occMap={};
    async function load(){
      if(!pid){
        page.innerHTML='<div class="eyebrow">Student</div><h1 class="title">My Student Dashboard</h1><p class="subtitle">Create a profile to get personalized career matches, gaps and learning paths.</p><div id="list"><div class="skel" style="height:120px"></div></div><div style="margin-top:16px"><a class="btn" href="profile.html">Create Profile</a></div>';
        try{
          const list=await window.KaushoraAPI.get("/api/student/profiles");
          const el=document.getElementById("list");
          if(!list.length) el.innerHTML=window.KShell.emptyState("No profiles yet","Create your first profile to see matches.");
          else el.innerHTML='<div class="grid cols-2">'+list.map(p=>'<a class="card" href="student.html?id='+p.id+'" style="text-decoration:none;color:inherit"><b>#'+p.id+' '+esc(p.status||"")+'</b><br><span style="color:var(--muted);font-size:13px">'+esc(p.district_id||"")+' · '+esc(p.goal||"")+' · '+p.created_at.slice(0,10)+'</span></a>').join("")+'</div>';
        }catch(e){ document.getElementById("list").innerHTML=window.KShell.errorState(e.message); }
        return;
      }
      page.innerHTML='<a href="student.html" class="btn ghost sm">All profiles</a><div class="card" style="margin-top:14px"><div class="skel" style="height:280px"></div></div>';
      try{
        const [p,a,occs]=await Promise.all([window.KaushoraAPI.get("/api/student/profile/"+pid), window.KaushoraAPI.get("/api/student/"+pid+"/analysis"), window.KaushoraAPI.get("/api/meta/occupations")]);
        profile=p; analysis=a;
        occMap={}; occs.forEach(function(o){ occMap[o.occupation_id]=o.posting_count||0; });
        render();
      }catch(e){
        page.innerHTML='<a href="student.html" class="btn ghost sm">All profiles</a><div style="margin-top:14px">'+window.KShell.errorState(e.message,"reload")+ '</div>';
        window.reload=()=>load();
      }
    }
    function render(){
      const prof=profile;
      document.title="Student #"+prof.id+" — Kaushora";
      let h='<a href="student.html" class="btn ghost sm">All profiles</a>';
      h+='<div class="card" style="margin-top:14px"><div class="profile-header"><div class="avatar">'+esc((prof.status||"S")[0])+'</div><div><h2 style="margin:0">Profile #'+prof.id+' — '+esc(prof.status)+'</h2><p style="margin:2px 0;color:var(--muted);font-size:13px">'+esc(prof.district_name||prof.district_id||"")+' · '+esc(prof.state_name||"")+' · '+esc(prof.goal||"")+'</p></div><span class="pill tag-green">Source data</span></div>';
      h+='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">';
      h+='<a class="btn ghost sm" href="profile.html?id='+prof.id+'">Edit Profile</a>';
      h+='<button class="btn ghost sm" onclick="if(confirm(\'Delete profile #'+prof.id+'?\'))fetch(\'/api/student/profile/'+prof.id+'\',{method:\'DELETE\'}).then(()=>location.href=\'student.html\')">Delete</button>';
      h+='</div></div>';
      h+='<h2 class="section">Career Matches</h2><p class="section-sub">Explainable matches from your skills, interests and education.</p>';
      var nScored = (analysis.career_matches||[]).length, nUnscored = (analysis.unscored_occupations||[]).length;
      if(!analysis.career_matches.length) h+=window.KShell.emptyState("No sufficiently supported matches","Only "+nScored+" of "+(nScored+nUnscored)+" occupations have explicit skill links; broadening interests may help.");
      else h+='<div class="grid cols-2">'+analysis.career_matches.map(m=>{
        var pc = occMap[m.occupation_id] || 0;
        var vacPill = pc > 0 ? '<span class="pill tag-blue" style="font-size:11px">'+pc+' postings</span>' : '';
        var cov = m.evidence_coverage||{};
        var covPill = cov.pct==null ? '<span class="pill tag-grey" style="font-size:11px" title="No researched mappings documented">evidence: unknown</span>'
          : '<span class="pill '+(cov.level==="High"?"tag-green":cov.level==="Medium"?"tag-amber":"tag-red")+'" style="font-size:11px" title="'+esc(cov.note||"")+'">evidence '+cov.pct+'%</span>';
        return '<div class="card career-card"><div style="display:flex;justify-content:space-between;align-items:start"><div><b>'+esc(m.occupation_name)+'</b><br><span style="font-size:12px;color:var(--muted)">'+esc(m.occupation_code||m.occupation_id)+' · '+esc(m.sector||"")+'</span></div><span class="pill '+(m.label==="Strong Match"?"tag-green":m.label==="Potential Match"?"tag-amber":"tag-grey")+'">'+esc(m.label)+'</span></div>'+
        '<div style="margin:8px 0"><b>'+m.score+'%</b> match · '+m.coverage+'% skill coverage <div class="gap-bar" style="margin-top:4px"><i style="width:'+m.coverage+'%"></i></div></div>'+
        '<p style="font-size:13px"><b>Why:</b> '+ (m.interest_aligned?"Interest aligned":"") +' '+(m.education_ok?"Education ok":"")+' · Matched '+m.matched_skills.length+'/'+m.required_count+' skills '+vacPill+' '+covPill+'</p>'+
        '<div style="margin:8px 0"><b style="font-size:13px">Top gaps:</b> '+(m.missing_skills.slice(0,3).map(sid=>'<span class="pill tag-grey">'+esc(sid)+'</span>').join(" ")||'<span style="color:var(--muted)">None</span>')+'</div>'+
        '<a class="btn ghost sm" href="career-detail.html?profile='+prof.id+'&occ='+m.occupation_id+'">Explore Career</a></div>';
      }).join("")+'</div>';
      h+='<h2 class="section">Skill Gaps</h2><p class="section-sub">Prioritized by importance + course availability.</p>';
      if(!analysis.prioritized_gaps.length) h+=window.KShell.emptyState("No gaps found","You cover required skills for top matches.");
      else h+='<div class="card"><div class="table-wrap"><table class="data"><thead><tr><th>Skill</th><th>Occurrences</th><th>Courses available</th><th></th></tr></thead><tbody>'+
        analysis.prioritized_gaps.map(g=>{
          const lp=analysis.learning_pathway.find(x=>x.skill_id===g.skill_id);
          const cnt=lp?lp.holder_count:0;
          return '<tr><td><b>'+esc(g.skill_name)+'</b><br><span style="font-size:12px;color:var(--muted)">'+esc(g.skill_id)+'</span></td><td>'+g.occurrences+'</td><td>'+cnt+'</td><td>'+(cnt?'<span class="pill tag-green">'+cnt+' courses</span>':'<span class="pill tag-grey">No mapped course</span>')+'</td></tr>';
        }).join("")+'</tbody></table></div></div>';
      h+='<div class="evidence-strip">'+window.KIcon("shield")+'<div><b>Methodology (derived by Kaushora).</b> '+esc(analysis.methodology.gap_priority)+'</div></div>';
      h+='<h2 class="section">Learning Path</h2><p class="section-sub">Current -> Gap -> Courses -> Target</p>';
      if(!analysis.learning_pathway.length) h+=window.KShell.emptyState("No pathway","No missing skills to address.");
      else{
        h+='<div class="grid" style="gap:12px">';
        analysis.learning_pathway.forEach(step=>{
          h+='<div class="card"><b>'+esc(step.skill_name)+'</b> <span style="color:var(--muted);font-size:12px">'+esc(step.skill_id)+'</span><div style="margin:8px 0">'
          if(step.courses.length) h+=step.courses.map(c=>'<a href="course-detail.html?id='+esc(c.course_id)+'" class="pill tag-green" style="text-decoration:none">'+esc(c.course_name)+' ('+esc(c.nsqf_level||"") +')</a>').join(" ");
          else h+='<span class="pill tag-grey">No mapped course currently available</span>';
          h+='</div></div>';
        });
        h+='</div>';
      }
      h+='<h2 class="section">Next Actions</h2>';
      h+=analysis.next_actions.map((a,i)=>'<div class="next-action"><div class="num">'+(i+1)+'</div><div><b>'+esc(a.action)+'</b><br><span style="font-size:13px;color:var(--muted)">'+esc(a.reason)+'</span></div></div>').join("");
      h+='<div class="card" style="margin-top:16px"><h3>Why am I seeing this?</h3><p style="font-size:13px;color:var(--muted)">Data used: your profile (status, skills with proficiency, interests, preferences, location, education) + '+(nScored+nUnscored)+' occupations with explicit NOS links + 15 ITI courses + labour indicators (state-level).<br>Method: '+esc(analysis.methodology.match_score)+'<br>Limitations: only '+nScored+' occupations scorable; district demand unpublished.</p><a class="btn ghost sm" href="ai.html">Ask Kaushora AI about your profile</a></div>';
      page.innerHTML=h;
    }
    function esc(s){ return window.KShell.escapeHtml(s); }
    load();
  })();
  </script>
</body>
</html>
