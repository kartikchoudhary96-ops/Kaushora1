<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>District Intelligence — Kaushora</title>
  <link rel="stylesheet" href="css/design.css" />
</head>
<body data-page="districts">
  <div id="shell"></div>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script>
    (function () {
      "use strict";
      const page = document.getElementById("page");
      async function load() {
        page.innerHTML = '<div class="eyebrow">District intelligence</div><h1 class="title">Districts</h1><div class="card"><div class="skel" style="height:240px"></div></div>';
        try {
          const rows = await window.KaushoraAPI.districts();
          render(rows);
        } catch (e) {
          page.innerHTML = window.KShell.errorState(e.message, "reload");
          window.reload = () => load();
        }
      }
      function render(rows) {
        const withCentres = rows.filter((d) => (d.training_centres || 0) > 0);
        let h = '<div class="eyebrow">District intelligence · ' + rows.length + ' Maharashtra districts (source data)</div>' +
          '<h1 class="title">District Intelligence</h1>' +
          '<p class="subtitle">PMKVY and ITI training presence across Maharashtra. Training demand is unpublished in the source, so gaps are not estimated — centre counts and capacity facts are shown as recorded.</p>' +
          '<div class="grid cols-2"><div class="card" style="display:flex;align-items:center;justify-content:center">' +
          '<img src="assets/district-map.png" alt="Maharashtra district map" style="width:100%;max-width:420px;height:auto" onerror="this.onerror=null;this.src=\'assets/district-map.svg\'" /></div>' +
          '<div class="card"><div class="eyebrow">Coverage</div><h3>' + withCentres.length + ' of ' + rows.length + ' districts with recorded centres</h3>' +
          '<p class="hint">' + withCentres.map((d) => esc(d.district) + " (" + d.training_centres + ")").join(" · ") + '</p>' +
          '<p class="hint">Nagpur (DT019) is the best-documented district: ITI Saoner, 120 CTS seats, 2 recommendations. Select any district for its evidence.</p></div></div>';
        h += '<div class="card" style="margin-top:16px"><div class="field" style="margin:0;max-width:420px"><label for="q">Find a district</label><div class="searchbar">' + window.KIcon("search") +
          '<input id="q" type="search" placeholder="e.g. Nagpur, Pune, Thane…" aria-label="Search districts" /></div></div>' +
          '<div class="table-wrap" style="margin-top:12px"><table class="data"><thead><tr><th>District</th><th>Code</th><th>Recorded centres</th><th>Capacity facts</th><th>Recommendations</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>';
        h += '<div class="evidence-strip">' + window.KIcon("shield") + "<div><b>Source data (REAL).</b> District registry, PMKVY centre lists and DVET capacity facts. "
          + "34 districts show honestly as having no recorded centres — absence of records, not absence of training.</div></div>";
        page.innerHTML = h;
        const paint = function () {
          const q = (document.getElementById("q").value || "").toLowerCase();
          const list = rows.filter((d) => !q || (d.district || "").toLowerCase().includes(q));
          document.getElementById("rows").innerHTML = list.map((d) =>
            "<tr><td><b>" + esc(d.district) + "</b></td><td>" + esc(d.district_code || "—") + "</td>" +
            "<td><b>" + (d.training_centres || 0) + "</b></td>" +
            "<td>" + (d.capacity ? esc(d.capacity.scheme || "") + (d.capacity.training_seats != null ? " · " + d.capacity.training_seats + " seats" : d.capacity.training_centres != null ? " · " + d.capacity.training_centres + " centres" : "") : "—") + "</td>" +
            "<td>" + (d.recommendations || 0) + "</td>" +
            '<td><a class="btn ghost sm" href="district-detail.html?id=' + encodeURIComponent(d.district_id) + '">Open</a></td></tr>').join("") ||
            '<tr><td colspan="6">No districts match this search.</td></tr>';
        };
        document.getElementById("q").addEventListener("input", paint);
        paint();
      }
      function esc(s) { return window.KShell.escapeHtml(s); }
      load();
    })();
  </script>
</body>
</html>
