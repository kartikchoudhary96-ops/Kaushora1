<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="Demand Gap Action flow">
  <!-- stage 1: demand -->
  <g>
    <rect x="10" y="60" width="140" height="180" rx="16" fill="#FFFFFF" stroke="#151515" stroke-width="3"/>
    <rect x="30" y="82" width="44" height="44" rx="8" fill="#B7D88A"/>
    <rect x="82" y="82" width="44" height="44" rx="8" fill="#B7D88A" opacity="0.55"/>
    <rect x="30" y="134" width="44" height="44" rx="8" fill="#B7D88A" opacity="0.55"/>
    <rect x="82" y="134" width="44" height="44" rx="8" fill="#151515"/>
    <text x="30" y="210" font-family="Arial,sans-serif" font-weight="900" font-size="17" fill="#151515">Demand</text>
    <text x="30" y="228" font-family="Arial,sans-serif" font-size="12" fill="#5b6257">Industry signals</text>
  </g>
  <polygon points="160,150 184,138 184,162" fill="#7ba05b"/>
  <!-- stage 2: gap -->
  <g>
    <rect x="194" y="60" width="140" height="180" rx="16" fill="#151515"/>
    <g fill="#B7D88A">
      <rect x="214" y="82" width="34" height="34" rx="7"/>
      <rect x="254" y="82" width="34" height="34" rx="7"/>
      <rect x="214" y="122" width="34" height="34" rx="7" opacity="0.45"/>
      <rect x="254" y="122" width="34" height="34" rx="7" fill="none" stroke="#B7D88A" stroke-width="3" stroke-dasharray="7 6"/>
    </g>
    <text x="214" y="210" font-family="Arial,sans-serif" font-weight="900" font-size="17" fill="#FFFFFF">Gap</text>
    <text x="214" y="228" font-family="Arial,sans-serif" font-size="12" fill="#B7D88A">Missing coverage</text>
  </g>
  <polygon points="344,150 368,138 368,162" fill="#7ba05b"/>
  <!-- stage 3: curriculum -->
  <g>
    <rect x="378" y="60" width="140" height="180" rx="16" fill="#FFFFFF" stroke="#151515" stroke-width="3"/>
    <rect x="398" y="82" width="64" height="80" rx="6" fill="#F3EDE1" stroke="#151515" stroke-width="3"/>
    <rect x="408" y="94" width="44" height="7" rx="3.5" fill="#151515"/>
    <rect x="408" y="106" width="44" height="7" rx="3.5" fill="#151515" opacity="0.4"/>
    <rect x="408" y="118" width="30" height="7" rx="3.5" fill="#7ba05b"/>
    <rect x="408" y="130" width="44" height="7" rx="3.5" fill="#151515" opacity="0.4"/>
    <circle cx="470" cy="150" r="16" fill="#B7D88A" stroke="#151515" stroke-width="3"/>
    <path d="M462 150 l6 6 l11 -12" fill="none" stroke="#151515" stroke-width="4" stroke-linecap="round"/>
    <text x="398" y="210" font-family="Arial,sans-serif" font-weight="900" font-size="17" fill="#151515">Action</text>
    <text x="398" y="228" font-family="Arial,sans-serif" font-size="12" fill="#5b6257">Update curriculum</text>
  </g>
  <polygon points="528,150 552,138 552,162" fill="#7ba05b"/>
  <!-- stage 4: outcome -->
  <g>
    <rect x="562" y="60" width="108" height="180" rx="16" fill="#B7D88A" stroke="#151515" stroke-width="3"/>
    <circle cx="616" cy="120" r="26" fill="#FFFFFF" stroke="#151515" stroke-width="3"/>
    <path d="M604 120 l9 9 l16 -18" fill="none" stroke="#151515" stroke-width="5" stroke-linecap="round"/>
    <text x="584" y="210" font-family="Arial,sans-serif" font-weight="900" font-size="17" fill="#151515">Ready</text>
    <text x="584" y="228" font-family="Arial,sans-serif" font-size="12" fill="#2f3a2a">Job-ready skills</text>
  </g>
</svg>
