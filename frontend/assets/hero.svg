<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-label="Kaushora intelligence flow illustration">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3E9"/>
      <stop offset="1" stop-color="#EFE7D3"/>
    </linearGradient>
  </defs>
  <path d="M40 60 C 200 20, 420 30, 620 50 C 760 64, 830 130, 840 260 C 850 400, 720 480, 520 490 C 320 500, 120 480, 60 380 C 10 290, 0 140, 40 60 Z" fill="url(#kbg)"/>
  <!-- demand blocks (left) -->
  <g>
    <rect x="90" y="180" width="70" height="46" rx="8" fill="#B7D88A"/>
    <rect x="170" y="180" width="70" height="46" rx="8" fill="#FFFFFF" stroke="#151515" stroke-width="3"/>
    <rect x="90" y="236" width="70" height="46" rx="8" fill="#FFFFFF" stroke="#151515" stroke-width="3"/>
    <rect x="170" y="236" width="70" height="46" rx="8" fill="#151515"/>
    <rect x="104" y="196" width="42" height="7" rx="3.5" fill="#151515" opacity="0.55"/>
    <rect x="104" y="208" width="28" height="7" rx="3.5" fill="#151515" opacity="0.3"/>
    <rect x="104" y="252" width="42" height="7" rx="3.5" fill="#B7D88A"/>
    <rect x="104" y="264" width="28" height="7" rx="3.5" fill="#B7D88A" opacity="0.55"/>
  </g>
  <!-- flow line to engine -->
  <path d="M245 231 C 300 231, 300 300, 360 300" fill="none" stroke="#7ba05b" stroke-width="7"/>
  <polygon points="360,300 344,292 344,308" fill="#7ba05b"/>
  <!-- engine platform (center) -->
  <g>
    <ellipse cx="450" cy="360" rx="120" ry="34" fill="#151515"/>
    <ellipse cx="450" cy="348" rx="120" ry="34" fill="#FFFFFF" stroke="#151515" stroke-width="3"/>
    <ellipse cx="450" cy="348" rx="88" ry="22" fill="#B7D88A"/>
    <g>
      <rect x="412" y="268" width="76" height="18" rx="3" fill="#FFFFFF" stroke="#151515" stroke-width="3"/>
      <rect x="420" y="250" width="60" height="18" rx="3" fill="#B7D88A" stroke="#151515" stroke-width="3"/>
      <rect x="428" y="232" width="44" height="18" rx="3" fill="#151515"/>
    </g>
    <circle cx="556" cy="250" r="10" fill="#B7D88A" stroke="#151515" stroke-width="3"/>
    <circle cx="586" cy="290" r="7" fill="#151515"/>
    <circle cx="348" cy="250" r="7" fill="#151515"/>
  </g>
  <!-- flow to charts -->
  <path d="M540 330 C 600 330, 600 220, 660 220" fill="none" stroke="#7ba05b" stroke-width="7"/>
  <polygon points="660,220 644,212 644,228" fill="#7ba05b"/>
  <!-- bar chart (right) -->
  <g>
    <rect x="668" y="150" width="150" height="150" rx="14" fill="#FFFFFF" stroke="#151515" stroke-width="3"/>
    <rect x="688" y="230" width="18" height="50" rx="4" fill="#E4DCC8"/>
    <rect x="712" y="208" width="18" height="72" rx="4" fill="#B7D88A"/>
    <rect x="736" y="222" width="18" height="58" rx="4" fill="#151515"/>
    <rect x="760" y="188" width="18" height="92" rx="4" fill="#B7D88A"/>
    <path d="M684 226 L714 200 L738 210 L768 178" fill="none" stroke="#151515" stroke-width="4" stroke-linecap="round"/>
    <polygon points="768,178 756,180 764,190" fill="#151515"/>
  </g>
  <!-- people (bottom right) -->
  <g>
    <circle cx="660" cy="360" r="16" fill="#B7D88A" stroke="#151515" stroke-width="3"/>
    <rect x="640" y="380" width="40" height="52" rx="12" fill="#FFFFFF" stroke="#151515" stroke-width="3"/>
    <circle cx="724" cy="352" r="16" fill="#151515"/>
    <rect x="704" y="372" width="40" height="60" rx="12" fill="#B7D88A" stroke="#151515" stroke-width="3"/>
  </g>
  <!-- network nodes (top left) -->
  <g stroke="#151515" stroke-width="2.5" opacity="0.8">
    <line x1="120" y1="90" x2="170" y2="70"/><line x1="170" y1="70" x2="220" y2="95"/>
    <line x1="120" y1="90" x2="150" y2="130"/><line x1="170" y1="70" x2="150" y2="130"/>
  </g>
  <g fill="#B7D88A" stroke="#151515" stroke-width="2.5">
    <circle cx="120" cy="90" r="8"/><circle cx="170" cy="70" r="8"/>
    <circle cx="220" cy="95" r="8"/><circle cx="150" cy="130" r="8"/>
  </g>
</svg>
