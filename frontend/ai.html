<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kaushora AI — Grounded Labour-Market Assistant</title>
  <link rel="stylesheet" href="css/design.css" />
  <style>
    .chat-wrap { grid-template-columns: 1fr; }
    .chat-wrap .card { display: flex; flex-direction: column; min-height: calc(100vh - 260px);
      padding: 22px 22px 12px; position: relative; overflow: hidden;
      background: linear-gradient(180deg, #fffdf4 0%, #ffffff 220px);
      box-shadow: 0 1px 2px rgba(21,21,21,.05), 0 18px 44px -20px rgba(76,122,53,.35); }
    .chat-wrap .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--pistachio), var(--pistachio-deep)); }
    .ai-hero { display: flex; align-items: center; gap: 14px; }
    .ai-badge { width: 52px; height: 52px; border-radius: 16px; flex: 0 0 52px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px -8px rgba(21,21,21,.55); }
    .ai-badge img { width: 52px; height: 52px; border-radius: 16px; display: block; }
    .ai-hero .title { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 38px;
      font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; color: #101210; }
    #presets .chip { transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
    #presets .chip:hover { transform: translateY(-2px); background: var(--pistachio-soft);
      box-shadow: 0 6px 14px -8px rgba(76,122,53,.5); }
    .chat-log { flex: 1 1 auto; max-height: none; min-height: 160px; }
    .bubble { animation: rise .25s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    .bubble.user { background: linear-gradient(135deg, var(--pistachio-soft), var(--pistachio));
      border: 1px solid var(--pistachio-deep); border-radius: 16px 16px 4px 16px;
      font-weight: 600; color: var(--pistachio-ink); }
    .bubble.ai { border-left: 4px solid var(--pistachio); border-radius: 4px 16px 16px 16px; }
    .bubble p { margin: 6px 0; }
    .bubble p:first-child { margin-top: 0; font-weight: 600; }
    .bubble ul { margin: 6px 0; padding-left: 20px; }
    .bubble li { margin: 3px 0; }
    .bubble li::marker { color: var(--pistachio-deep); font-weight: 800; }
    .bubble .meta { text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px;
      font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .bubble .meta::before { content: ""; width: 7px; height: 7px; border-radius: 50%;
      background: var(--pistachio-deep); }
    .bubble .meta.off::before { background: var(--muted); }
    .chat-input input { border-radius: 999px; padding: 12px 18px; border: 1px solid var(--line);
      font: inherit; background: #fff; }
    .chat-input input:focus { outline: 2px solid var(--pistachio); border-color: var(--pistachio-deep); }
    .ai-send { width: 46px; height: 46px; border-radius: 50%; padding: 0; justify-content: center;
      font-size: 20px; line-height: 1; flex: 0 0 46px; border: none;
      background: linear-gradient(135deg, var(--pistachio-deep), var(--pistachio-ink)); }
    .ai-send:hover { box-shadow: 0 8px 18px -8px rgba(76,122,53,.7); }
    .thinking { display: inline-flex; gap: 6px; align-items: center; padding: 6px 0; }
    .thinking span { width: 8px; height: 8px; border-radius: 50%; background: var(--pistachio-deep);
      animation: blink 1.1s infinite; }
    .thinking span:nth-child(2) { animation-delay: .18s; }
    .thinking span:nth-child(3) { animation-delay: .36s; }
    @keyframes blink { 0%, 100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body data-page="ai">
  <div id="shell"></div>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script>
    (function () {
      "use strict";
      const page = document.getElementById("page");
      const PRESETS = [
        "Which skills are most in demand?",
        "What should I learn next?",
        "What career paths match my skills?",
        "Which courses address my skill gaps?",
        "Which districts have training data?",
        "Why was this career recommended for me?"
      ];

      function getCtx(){
        const url=new URLSearchParams(location.search);
        const sid=url.get("student_id")||url.get("id")||localStorage.getItem("kaushora_last_profile")||"";
        // detect entity from referrer or current context (skill/occupation/course/district pages may link with ?entity=)
        const ent=url.get("entity")||url.get("type");
        const eid=url.get("entity_id")||url.get("skill")||url.get("occ")||url.get("course");
        return {student_id:sid||null, entity:ent||null, entity_id:eid||null};
      }
      function load() {
        const ctx=getCtx();
        let ctxNote="";
        if(ctx.student_id) ctxNote='<div class="pill tag-green" style="margin-bottom:8px">Student #'+esc(ctx.student_id)+' context attached</div>';
        else if(ctx.entity) ctxNote='<div class="pill tag-blue" style="margin-bottom:8px">'+esc(ctx.entity)+' '+esc(ctx.entity_id)+' context</div>';
        page.innerHTML =
          '<div class="ai-hero"><div class="ai-badge"><img src="assets/ai-logo.svg" alt="Kaushora AI logo" /></div><div><h1 class="title">Kaushora AI</h1></div></div>' +
          '<p class="subtitle">Career questions answered from Kaushora records — anything else from general knowledge.</p>' +ctxNote+
          '<div class="chat-wrap"><div class="card"><div class="eyebrow" style="margin-bottom:8px">Try one</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px" id="presets">' +
          PRESETS.map((p) => '<button class="chip preset" data-q="' + esc(p) + '">' + esc(p) + "</button>").join("") + "</div>" +
          '<div class="chat-log" id="log" aria-live="polite"><div class="bubble ai"><p>Ask about careers, skills, courses — or anything else.</p></div></div>' +
          '<form class="chat-input" id="f"><input id="q" placeholder="Ask anything…" aria-label="Ask Kaushora AI" autocomplete="off" />' +
          '<button class="btn ai-send" type="submit" id="go" aria-label="Send">↑</button></form></div></div>';
        document.querySelectorAll(".preset").forEach((b) => b.addEventListener("click", () => { if(b.dataset.q){ document.getElementById("q").value = b.dataset.q; ask(); } }));
        document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
      }

      async function ask() {
        const input = document.getElementById("q"), log = document.getElementById("log"), btn = document.getElementById("go");
        const q = input.value.trim();
        if (!q) return;
        const ctx=getCtx();
        log.insertAdjacentHTML("beforeend", '<div class="bubble user">' + esc(q) + "</div>");
        input.value = "";
        btn.disabled = true; btn.textContent = "…";
        const thinking = document.createElement("div");
        thinking.className = "bubble ai"; thinking.innerHTML = '<span class="thinking"><span></span><span></span><span></span></span>';
        log.appendChild(thinking); log.scrollTop = log.scrollHeight;
        try {
          // forward student/entity context to backend for grounding
          const payload={question:q};
          if(ctx.student_id) payload.student_id=ctx.student_id;
          if(ctx.entity) { payload.entity=ctx.entity; payload.entity_id=ctx.entity_id; }
          const r = await window.KaushoraAPI.post("/api/ai/chat", payload);
          let tag = "Fallback summary", cls = "off";
          if (r.ai_available) { tag = (r.data_source === "GENERAL") ? "Ollama · General knowledge" : "Ollama · Kaushora records"; cls = "live"; }
          thinking.innerHTML = formatAnswer(r.answer) + '<div class="meta ' + cls + '">' + esc(tag) + "</div>";
        } catch (e) {
          thinking.innerHTML = "<b>Request failed.</b> " + esc(e.message);
        } finally { btn.disabled = false; btn.textContent = "↑"; log.scrollTop = log.scrollHeight; }
      }
      function esc(s) { return window.KShell.escapeHtml(s); }
      // Structured render: escape first (XSS-safe), then shape lead/bullets/bold.
      function formatAnswer(raw) {
        let txt = (raw || "").replace(/^\[General knowledge\]\s*/, "");
        let html = esc(txt);
        html = html.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
        const lines = html.split("\n");
        let out = "", inList = false;
        lines.forEach(function (ln) {
          const t = ln.trim();
          if (/^source\s*:/i.test(t)) return; // safety net: never show a Source: line
          if (/^[•\-*]\s+/.test(t)) {
            if (!inList) { out += "<ul>"; inList = true; }
            out += "<li>" + t.replace(/^[•\-*]\s+/, "") + "</li>";
          } else {
            if (inList) { out += "</ul>"; inList = false; }
            if (t) out += "<p>" + ln.trim() + "</p>";
          }
        });
        if (inList) out += "</ul>";
        return out;
      }
      load();
    })();
  </script>
</body>
</html>
