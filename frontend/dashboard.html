<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Kaushora Labour Market Intelligence</title>
  <link rel="stylesheet" href="css/design.css" />
</head>
<body data-page="dashboard">
  <div id="shell"></div>
  <script src="js/vendor/chart.umd.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script>
    (function () {
      "use strict";
      const page = document.getElementById("page");
      const PAL = ["#4c7a35", "#b7d88a", "#151515", "#e8b44f", "#5b8fc4", "#cf5f52", "#8a9a5b", "#c9b896", "#6f7468"];
      let charts = [];

      function kpi(label, value, sub, tag, tagCls) {
        const help={
          "Skills tracked":"27 real skills from NSDC (SKL001-027), sector derived from linked occupations. <code>data_source=REAL</code>.",
          "Training courses":"29 Government ITI courses (Saoner Nagpur + Mumbai + DVET + SIDH) with NSQF levels. <code>data_source=REAL</code>.",
          "Occupations":"33 NSDC occupations with QP codes; explicit NOS skill links plus QP/NOS evidence (DSRC_* sources) with per-occupation evidence coverage.",
          "Districts covered":"36 Maharashtra districts registry; 8 recorded training centres (Ahilyanagar 7, Nagpur 1).",
          "Avg. alignment":"Coverage vs best same-sector explicit occupation; cross-sector never scored. 5 reference 100% shown alongside.",
          "Job postings":"2,471 real LinkedIn job postings from Role Radar (HuggingFace, Apache 2.0). Scraped 2026-04/05. <code>is_synthetic=0</code>.",
          "High-demand skills":"7 skills with observed demand signals from WEF/NASSCOM (85%+ score).",
        }[label]||"";
        return '<div class="card kpi"><div class="k-label">' + label + ' <span title="'+esc(help)+'" style="cursor:help;color:var(--muted)">ⓘ</span></div><div class="k-value">' + value +
          '</div><div class="k-sub">' + sub + '</div>' + (tag ? '<span class="k-tag ' + tagCls + '">' + tag + "</span>" : "") + (help?'<details style="margin-top:6px"><summary style="font-size:11px;color:var(--muted);cursor:pointer">Why am I seeing this?</summary><p style="font-size:12px;color:var(--muted);margin:4px 0 0">'+esc(help)+'</p></details>':"") + "</div>";
      }

      async function load() {
        page.innerHTML =
          '<div class="eyebrow">Overview · Updated live from the backend</div>' +
          '<h1 class="title">Labour Market Intelligence</h1>' +
          '<p class="subtitle">Maharashtra-focused skill intelligence — every figure traced to its record. Change context below to filter what you see.</p>' +
          '<div id="contextBar" class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding:14px"><div class="skel" style="height:38px;width:120px"></div></div>' +
          window.KShell.skeletonCards(5) + '<div class="card" style="margin-top:16px"><div class="skel" style="height:220px"></div></div>';
        try{ await renderContextBar(); }catch(e){}
        try {
          const [ov, courses, croles, trends, ds, ev, ind, recs, jobs] = await Promise.all([
            window.KaushoraAPI.overview(), window.KaushoraAPI.courses(),
            window.KaushoraAPI.careerRoles(), window.KaushoraAPI.trends(), window.KaushoraAPI.dataStatus(),
            window.KaushoraAPI.evidence(), window.KaushoraAPI.indicators(), window.KaushoraAPI.recommendations(),
            window.KaushoraAPI.get("/api/jobs").catch(function(){ return {data:{summary:{total:0}}}; })
          ]);
          render(ov, courses, croles, trends, ds, ev, ind, recs);
          renderJobMarket(jobs && jobs.data ? jobs.data : null);
        } catch (e) {
          page.innerHTML = window.KShell.errorState(e.message, "reload");
          window.reload = () => load();
        }
      }

      function render(ov, courses, croles, trends, ds, ev, ind, recs) {
        const t = ov.totals;
        const alignTxt = t.avg_alignment == null ? "—" : t.avg_alignment + "%";
        let h = '<div class="eyebrow">Overview · ' + esc(ds.last_ingestion ? ds.last_ingestion.started_at.slice(0, 10) : "live") + "</div>" +
          '<h1 class="title">Labour Market Intelligence</h1>' +
          '<p class="subtitle">Maharashtra-focused skill intelligence from PLFS, NSDC, PMKVY, DVET, DGT and Role Radar sources — every figure traced to its record.</p>' +
          '<div class="grid kpis">' +
          kpi("Skills tracked", t.unique_skills, "Real catalog (SKL001–027)", "Source data", "tag-green") +
          kpi("Training courses", t.courses, "Government ITI courses", "Source data", "tag-green") +
          kpi("Occupations", t.roles, "NSDC QPs with NSQF levels", "Source data", "tag-green") +
          kpi("Job postings", t.jobs_analysed, "Real LinkedIn postings (Role Radar)", "Source data", "tag-green") +
          kpi("Districts covered", t.districts, "Maharashtra registry · " + t.centres + " centres recorded", "Source data", "tag-green") +
          kpi("Avg. alignment", alignTxt, "Assessable course coverage", t.avg_alignment == null ? "Cannot assess" : "Derived by Kaushora", t.avg_alignment == null ? "tag-grey" : "tag-amber") +
          kpi("High-demand skills", t.high_demand_skills, "Observed demand (WEF/NASSCOM)", "Derived by Kaushora", "tag-amber") +
          "</div>";

        // Insight → Evidence → Action (reusable pattern, here with the weakest alignment)
        const weakest = (function(){
          let best=null; for(const co of courses){ try{ const a=window.KaushoraAPI ? null : null; }catch(e){} }
          // we have `ov` already scored; pick the course with lowest non-null alignment from earlier `aligns` via overview
          // fallback to first assessable
          return null;
        })();
        h += '<div class="card" style="margin:16px 0 0;border-left:4px solid var(--pistachio)"><div class="eyebrow">Insight → Evidence → Action</div><h3 style="margin:4px 0 6px">Training coverage appears insufficient for several ITI courses</h3>'+
          '<p style="font-size:13px;margin:0 0 8px"><b>Insight:</b> Average alignment '+alignTxt+' across '+ (courses.filter(c=>c.id).length)+' assessable courses; 5 reference assessments are 100% but engine scores are low where explicit occupation links are sparse.</p>'+
          '<p style="font-size:13px;margin:0 0 8px"><b>Evidence:</b> Explore Courses → each card shows required vs covered skills and the missing list; 34 districts show centre counts honestly.</p>'+
          '<p style="font-size:13px;margin:0"><b>Action:</b> Review course coverage for the lowest-scoring courses or publish missing NOS links for unmapped occupations. <a href="courses.html">Open Courses →</a></p></div>';

        h += '<div class="evidence-strip" style="margin:16px 0 0">' + window.KIcon("db") +
          "<div><b>Job market intelligence now active.</b> " + (t.jobs_analysed || 0) + " real LinkedIn postings from Role Radar (HuggingFace, Apache 2.0) provide vacancy evidence. " +
          "Skills extracted from job descriptions map to the Kaushora catalog. See <a href='jobs.html'>Job Market Intelligence →</a></div></div>";

        h += '<h2 class="section">Job Market Intelligence</h2>' +
          '<p class="section-sub">Real LinkedIn job postings — skills demanded, sectors hiring, geographic distribution.</p>' +
          '<div class="grid cols-2" style="margin-top:12px">' +
          '<div class="card"><div class="eyebrow">Role Radar · 2026-04/05</div><h3>Top Demanded Skills</h3><p class="hint">Extracted from job descriptions. Count = number of postings mentioning each skill.</p><div id="jobSkills"></div></div>' +
          '<div class="card"><div class="eyebrow">Role Radar · Sector breakdown</div><h3>Postings by Sector</h3><p class="hint">Industry-to-sector mapping from real postings.</p><div id="jobSectors"></div></div></div>' +
          '<div class="grid cols-2" style="margin-top:16px">' +
          '<div class="card"><div class="eyebrow">Geographic distribution</div><h3>Postings by State</h3><p class="hint">Maharashtra leads with 604 postings. State extracted from LinkedIn location field.</p><div class="chart-box sm"><canvas id="chJobState"></canvas></div></div>' +
          '<div class="card"><div class="eyebrow">Employment type</div><h3>Full-time vs Contract vs Internship</h3><p class="hint">Breakdown from real postings.</p><div class="chart-box sm"><canvas id="chJobEmp"></canvas></div></div></div>';

        h += '<h2 class="section">Recorded labour-market evidence</h2>' +
          '<p class="section-sub">Observed values with source references — not estimates.</p>' +
          '<div class="grid kpis" id="evKpis"></div>' +
          '<div class="grid cols-2" style="margin-top:16px">' +
          '<div class="card"><div class="eyebrow">PLFS 2025 · Usual status</div><h3>LFPR / WPR / UR by group</h3><p class="hint">All-India, 15 years and above. District-level PLFS is not published.</p><div class="chart-box sm"><canvas id="chInd"></canvas></div></div>' +
          '<div class="card"><div class="eyebrow">Evidence-based actions</div><h3>Recommendations</h3><p class="hint">Provided derivations + Kaushora derivations from live evidence.</p><div id="recList"></div></div></div>';

        h += '<div class="grid cols-23" style="margin-top:16px">' +
          '<div class="card"><div class="eyebrow">Signature · Skill × Role coverage</div><h3>Skill Coverage Landscape</h3>' +
          '<p class="hint">Explicit NOS occupation requirements vs recorded course coverage (scorable occupations only). Green = required &amp; taught · red = required but untaught · grey = taught, no mapped requirement. Select a row for detail.</p>' +
          '<div id="matrix"></div></div>' +
          '<div class="card"><div class="eyebrow">Priority alignment signals</div><h3>Actions</h3><p class="hint">From live course alignment + trend evidence.</p><div id="actions"></div></div></div>';

        h += '<div class="grid cols-2" style="margin-top:16px">' +
          '<div class="card"><div class="eyebrow">Catalog composition</div><h3>Occupations by sector</h3><p class="hint">Live counts from the 32-occupation registry.</p><div class="chart-box sm"><canvas id="chSector"></canvas></div></div>' +
          '<div class="card"><div class="eyebrow">Training footprint</div><h3>Recorded skill coverage per course</h3><p class="hint">Explicit course-skill links (12 recorded; courses without rows show honestly as 0).</p><div class="chart-box sm"><canvas id="chCourse"></canvas></div></div></div>';

        h += '<h2 class="section">Where Training May Not Match Demand</h2>' +
          '<p class="section-sub">Live course alignment against explicit NOS occupation requirements (same-sector only).</p><div id="mismatch"></div>';

        h += '<div class="grid cols-23" style="margin-top:16px">' +
          '<div><h2 class="section" style="margin-top:0">Priority Competencies Registry</h2>' +
          '<p class="section-sub">Catalogued skills ranked by cross-role versatility (live explicit-mapping count — not a demand index).</p><div id="registry"></div></div>' +
          '<div><h2 class="section" style="margin-top:0">Regional Disparity Index</h2>' +
          '<p class="section-sub">Recorded training centres across 36 Maharashtra districts.</p>' +
          '<div class="card" style="text-align:center"><img src="assets/district-map.png" alt="Maharashtra district map" style="width:100%;max-width:300px;height:auto" onerror="this.onerror=null;this.src=\'assets/district-map.svg\'" />' +
          '<p class="hint" style="margin-top:10px"><b>' + t.centres + ' centres recorded in 2 of ' + t.districts + ' districts</b> (Ahilyanagar 7, Nagpur 1). Capacity gaps cannot be estimated — training demand is unpublished.</p>' +
          '<a class="btn ghost sm" href="districts.html">Open district intelligence</a></div></div></div>';

        h += '<h2 class="section">Emerging signals (qualitative)</h2>' +
          '<p class="section-sub">WEF Future of Jobs evidence — sector-level direction, not skill-level measurement.</p>' +
          '<div class="grid cols-3" id="trendCards"></div>';

        h += '<div class="evidence-strip">' + window.KIcon("shield") + "<div><b>Data freshness &amp; scope.</b> " +
          "Last ingestion: " + esc(ds.last_ingestion ? ds.last_ingestion.started_at : "unknown") +
          " · Periods: " + esc((ds.periods || []).join("; ")) + " · Scope: " + esc(ds.geographic_scope || "national") + ".</div></div>";

        page.innerHTML = h;
        renderMatrix(croles, courses);
        renderActions(ov.actions || []);
        renderSectorChart(croles);
        renderCourseChart(courses);
        renderMismatch(courses);
        renderRegistry(ov.top_skills || []);
        renderTrends(trends.trend_signals || []);
        renderEvidence(ev || []);
        renderIndicators(ind || []);
        renderRecs(recs || []);
      }

      function renderEvidence(ev) {
        const pick = ["EV001", "EV003", "EV008", "EV006", "EV010"];
        const cards = ev.filter(function (e) { return pick.indexOf(e.evidence_id) >= 0; });
        document.getElementById("evKpis").innerHTML = cards.map(function (e) {
          return '<div class="card kpi"><div class="k-label">' + esc(e.metric_name) + '</div>' +
            '<div class="k-value" style="font-size:24px">' + esc(e.metric_value) + " " + esc(e.unit || "") + "</div>" +
            '<div class="k-sub">' + esc(e.geography || "") + " · " + esc(e.time_period || "") + "</div>" +
            '<span class="k-tag tag-green">Source data</span></div>';
        }).join("");
      }

      function renderIndicators(ind) {
        const rows = ind.filter(function (r) { return ["LFPR", "WPR", "UR"].indexOf(r.indicator_name) >= 0 && r.population_group === "15 years and above" && r.rural_urban === "Total"; });
        drawChart("chInd", {
          type: "bar",
          data: { labels: rows.map(function (r) { return r.indicator_name; }),
                  datasets: [{ data: rows.map(function (r) { return r.indicator_value; }), backgroundColor: PAL.slice(0, rows.length), borderRadius: 8 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                     scales: { y: { title: { display: true, text: "% (PLFS 2025 usual status)" } } } }
        });
      }

      function renderRecs(recs) {
        const el = document.getElementById("recList");
        if (!recs.length) { el.innerHTML = window.KShell.emptyState("No recommendations", "No recommendation records available."); return; }
        el.innerHTML = recs.slice(0, 5).map(function (r) {
          const cls = r.priority === "High" ? "tag-red" : r.priority === "Medium" ? "tag-amber" : "tag-grey";
          return '<div style="padding:9px 0;border-bottom:1px solid var(--line-soft)"><span class="pill ' + cls + '">' + esc(r.priority || "") + "</span> " +
            '<span class="pill tag-grey">' + (r.engine ? "Derived by Kaushora" : "Source derivation") + "</span>" +
            '<div style="font-weight:700;margin-top:5px">' + esc(r.recommendation_text || "") + "</div>" +
            '<div style="font-size:12.5px;color:var(--muted)">' + esc(r.reason || "") + "</div></div>";
        }).join("");
      }

      function renderMatrix(croles, courses) {
        // skill -> {requiredBy:Set, taughtBy:Set, name, sector}
        const req = {};
        croles.forEach(function (r) { (r.required_skills || []).forEach(function (s) { (req[s] = req[s] || new Set()).add(r.role_id); }); });
        window.KaushoraAPI.skills().then(function (skills) {
          const byId = {};
          skills.forEach(function (s) { byId[s.id] = s; });
          const taught = {};
          courses.forEach(function (c) {
            (c.skills_taught || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean)
              .forEach(function (s) { (taught[s] = taught[s] || new Set()).add(c.id); });
          });
          // Scorable occupations only: 4 carry explicit requirements; the other
          // 28 would render as empty columns, so they are honestly excluded.
          const scorable = croles.filter(function (r) { return (r.required_skills || []).length > 0; });
          const roleIds = scorable.map(function (r) { return r.role_id; });
          let h = '<p class="hint">Columns: explicitly-mapped occupations only (' + roleIds.length + ' of ' + croles.length + '). Remaining occupations carry no published NOS skill links.</p>' +
            '<div class="table-wrap"><table class="data" style="min-width:560px"><thead><tr><th>Skill</th>' +
            roleIds.map(function (r) { return "<th title='" + esc((scorable.filter(function (x) { return x.role_id === r; })[0] || {}).job_title || r) + "'>" + esc(r) + "</th>"; }).join("") + "<th>Taught by</th></tr></thead><tbody>";
          skills.slice().sort(function (a, b) { return a.skill_name.localeCompare(b.skill_name); }).forEach(function (s) {
            h += '<tr class="clickable" data-skill="' + s.id + '"><td><b>' + esc(s.skill_name) + '</b><br><span style="color:var(--muted);font-size:12px">' + esc(s.sector || "") + "</span></td>";
            roleIds.forEach(function (r) {
              const need = req[s.id] && req[s.id].has(r);
              const got = taught[s.id] && taught[s.id].size > 0;
              const col = !need && !got ? "#f1ecdd" : need && got ? "#4c7a35" : need ? "#cf5f52" : "#b9bfae";
              h += '<td><span title="' + (need ? "Required" : "Not required") + (got ? " · taught" : "") +
                '" style="display:inline-block;width:16px;height:16px;border-radius:5px;background:' + col + '"></span></td>';
            });
            h += "<td>" + ((taught[s.id] || new Set()).size || "—") + " course(s)</td></tr>";
          });
          document.getElementById("matrix").innerHTML = h + "</tbody></table></div>";
          document.querySelectorAll("#matrix tr.clickable").forEach(function (tr) {
            tr.addEventListener("click", () => (window.location.href = "skill-detail.html?id=" + encodeURIComponent(tr.dataset.skill)));
          });
        }).catch(function (e) {
          document.getElementById("matrix").innerHTML = window.KShell.errorState(e.message);
        });
      }

      function renderActions(actions) {
        if (!actions.length) {
          document.getElementById("actions").innerHTML = window.KShell.emptyState("No actions", "No alignment signals in the current dataset.");
          return;
        }
        document.getElementById("actions").innerHTML = actions.slice(0, 6).map(function (a) {
          const cls = a.priority === "High" ? "tag-red" : a.type === "trend" ? "tag-blue" : "tag-amber";
          return '<div style="padding:10px 0;border-bottom:1px solid var(--line-soft)"><span class="pill ' + cls + '">' +
            esc(a.priority || a.type) + '</span><div style="font-weight:700;margin-top:6px">' + esc(a.title) + '</div>' +
            '<div style="font-size:13px;color:var(--muted)">' + esc(a.reason || "") + "</div></div>";
        }).join("");
      }

      function renderSectorChart(croles) {
        const counts = {};
        croles.forEach(function (r) { counts[r.sector || "Unmapped"] = (counts[r.sector || "Unmapped"] || 0) + 1; });
        drawChart("chSector", {
          type: "doughnut",
          data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: PAL, borderColor: "#fff", borderWidth: 3 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "right" } } }
        });
      }

      function renderCourseChart(courses) {
        const labels = courses.map(function (c) { return c.course_name; });
        const counts = courses.map(function (c) {
          return (c.skills_taught || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean).length;
        });
        drawChart("chCourse", {
          type: "bar",
          data: { labels, datasets: [{ label: "Skills taught", data: counts, backgroundColor: PAL.slice(0, labels.length), borderRadius: 8 }] },
          options: {
            indexAxis: "y", responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { ticks: { precision: 0 }, title: { display: true, text: "skills in curriculum" } } },
            onClick: (e, els) => { if (els.length) window.location.href = "course-detail.html?id=" + encodeURIComponent(courses[els[0].index].id); }
          }
        });
      }

      async function renderMismatch(courses) {
        const rows = [];
        for (const c of courses) {
          try {
            const a = await window.KaushoraAPI.courseAlignment(c.id);
            rows.push({ c, a });
          } catch (e) { rows.push({ c, a: null }); }
        }
        let h = '<div class="table-wrap"><table class="data"><thead><tr><th>Course</th><th>Coverage</th><th>Status</th><th>Recommended action</th><th></th></tr></thead><tbody>';
        rows.forEach(function (r) {
          const score = r.a && r.a.alignment_score;
          const status = score == null
            ? '<span class="pill tag-grey">Insufficient data</span>'
            : score >= 80 ? '<span class="pill tag-green">Aligned</span>'
            : score >= 65 ? '<span class="pill tag-amber">Partial gap</span>' : '<span class="pill tag-red">Major gap</span>';
          h += "<tr><td><b>" + esc(r.c.course_name) + "</b><br><span style='color:var(--muted);font-size:12px'>" + esc(r.c.sector || "") + "</span></td>" +
            "<td><b>" + (score == null ? "—" : score + "%") + "</b></td><td>" + status + "</td>" +
            "<td>" + esc((r.a && r.a.recommended_action) || "Cannot assess") + "</td>" +
            '<td><a class="btn ghost sm" href="course-detail.html?id=' + encodeURIComponent(r.c.id) + '">Analyze</a></td></tr>';
        });
        document.getElementById("mismatch").innerHTML = h + "</tbody></table></div>";
      }

      function renderRegistry(topSkills) {
        const rows = topSkills.slice().sort(function (a, b) { return (b.related_roles || []).length - (a.related_roles || []).length; });
        let h = '<div class="table-wrap"><table class="data" style="min-width:520px"><thead><tr><th>Skill</th><th>Cross-role versatility</th><th>Sector</th><th>Audit grounding</th><th></th></tr></thead><tbody>';
        rows.forEach(function (s) {
          h += "<tr><td><b>" + esc(s.skill_name) + "</b></td>" +
            "<td><b>" + (s.related_roles || []).length + "</b> role(s)</td>" +
            "<td>" + esc(s.sector || "—") + "</td>" +
            '<td><span class="pill ' + (s.demand_status === "Insufficient data" ? "tag-grey" : "tag-red") + '">' + esc(s.demand_status) + '</span></td>' +
            '<td><a class="btn ghost sm" href="skill-detail.html?id=' + encodeURIComponent(s.id) + '">Dossier</a></td></tr>';
        });
        document.getElementById("registry").innerHTML = h + "</tbody></table></div>";
      }

      function renderTrends(signals) {
        document.getElementById("trendCards").innerHTML = signals.map(function (t, i) {
          const dir = (t.trend_direction || "").toLowerCase() === "growing" ? "tag-green" : "tag-grey";
          return '<div class="card"><span class="pill ' + dir + '">' + esc(t.trend_direction || "—") + "</span>" +
            "<h3 style='margin-top:8px'>" + esc(t.technology) + "</h3>" +
            '<p class="hint">' + esc(t.evidence || t.trend_description || "") + "</p>" +
            '<div style="font-size:12px;color:var(--muted)">' + esc(t.source || "") + " · " + esc(t.period || "") + "</div></div>";
        }).join("");
      }

      function renderJobMarket(jobs) {
        if (!jobs || !jobs.summary || jobs.summary.total === 0) return;
        // Top skills
        const skEl = document.getElementById("jobSkills");
        if (skEl && jobs.top_skills && jobs.top_skills.length) {
          skEl.innerHTML = jobs.top_skills.map(function (s) {
            return '<div style="padding:6px 0;border-bottom:1px solid var(--line-soft)"><b>' + esc(s.skill_name) + '</b> <span class="pill tag-blue">' + s.c + ' postings</span></div>';
          }).join("");
        }
        // Sectors
        const secEl = document.getElementById("jobSectors");
        if (secEl && jobs.by_sector && jobs.by_sector.length) {
          secEl.innerHTML = jobs.by_sector.slice(0, 8).map(function (s) {
            return '<div style="padding:6px 0;border-bottom:1px solid var(--line-soft)"><b>' + esc(s.sector) + '</b> <span class="pill tag-grey">' + s.c + '</span></div>';
          }).join("");
        }
        // State chart
        if (jobs.by_state && jobs.by_state.length) {
          drawChart("chJobState", {
            type: "bar",
            data: { labels: jobs.by_state.slice(0, 8).map(function (s) { return s.state; }),
                    datasets: [{ label: "Postings", data: jobs.by_state.slice(0, 8).map(function (s) { return s.c; }), backgroundColor: PAL.slice(0, 8), borderRadius: 6 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                       scales: { y: { title: { display: true, text: "job postings" } } } }
          });
        }
        // Employment type chart
        if (jobs.by_employment && jobs.by_employment.length) {
          drawChart("chJobEmp", {
            type: "doughnut",
            data: { labels: jobs.by_employment.map(function (e) { return e.employment_type || "Unknown"; }),
                    datasets: [{ data: jobs.by_employment.map(function (e) { return e.c; }), backgroundColor: PAL, borderColor: "#fff", borderWidth: 3 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "right" } } }
          });
        }
      }

      async function renderContextBar(){
        const bar=document.getElementById("contextBar");
        if(!bar) return;
        try{
          const [states, districts, sectors]=await Promise.all([
            window.KaushoraAPI.get("/api/meta/states"),
            window.KaushoraAPI.get("/api/meta/districts"),
            window.KaushoraAPI.get("/api/sectors")
          ]);
          bar.innerHTML=
            '<div class="field" style="margin:0;min-width:140px"><label style="font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--muted)">State</label><select id="ctxState" class="inline-filter" style="width:100%;padding:8px"><option value="ST001">Maharashtra (36 districts)</option></select></div>'+
            '<div class="field" style="margin:0;min-width:160px"><label style="font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--muted)">District</label><select id="ctxDist" class="inline-filter" style="width:100%;padding:8px"><option value="">All districts</option>'+districts.map(d=>'<option value="'+d.district_id+'">'+esc(d.district_name)+'</option>').join("")+'</select></div>'+
            '<div class="field" style="margin:0;min-width:100px"><label style="font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--muted)">Year</label><select class="inline-filter" style="width:100%;padding:8px"><option>2025</option></select></div>'+
            '<div class="field" style="margin:0;min-width:140px"><label style="font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--muted)">Sector</label><select id="ctxSec" class="inline-filter" style="width:100%;padding:8px"><option value="">All sectors</option>'+sectors.map(s=>'<option>'+esc(s.sector_name)+'</option>').join("")+'</select></div>'+
            '<div style="align-self:end"><button class="btn ghost sm" id="ctxGo">View district →</button></div>'+
            '<span style="align-self:center;font-size:12px;color:var(--muted);margin-left:8px">Changing district opens its intelligence page (source data).</span>';
          document.getElementById("ctxDist").addEventListener("change",e=>{
            const v=e.target.value;
            if(v) document.getElementById("ctxGo").onclick=()=>location.href="district-detail.html?id="+v;
          });
          document.getElementById("ctxGo").addEventListener("click",()=>{
            const v=document.getElementById("ctxDist").value;
            if(v) location.href="district-detail.html?id="+v;
            else location.href="districts.html";
          });
        }catch(e){ bar.innerHTML='<span style="font-size:13px;color:var(--muted)">Context: Maharashtra · 36 districts · 2025 (state-level indicators only)</span>'; }
      }
      function drawChart(id, cfg) {
        const el = document.getElementById(id);
        if (!el || typeof Chart === "undefined") return;
        charts.push(new Chart(el, cfg));
      }
      function esc(s) { return window.KShell.escapeHtml(s); }
      load();
    })();
  </script>
</body>
</html>
