<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Profile — Kaushora</title>
  <link rel="stylesheet" href="css/design.css" />
  <style>
    .wizard { max-width: 760px; margin: 0 auto; }
    .progress { display:flex; gap:8px; margin: 16px 0; }
    .progress i { flex:1; height:6px; border-radius:99px; background:#eee7d2; }
    .progress i.on { background: var(--pistachio); }
    .progress i.done { background: var(--pistachio-deep); }
    .step-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:var(--shadow); }
    .choice-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:12px; }
    @media(max-width:600px){ .choice-grid{ grid-template-columns:1fr; } }
    .choice { border:2px solid var(--line); border-radius:14px; padding:18px; cursor:pointer; background:#fff; text-align:left; transition: all .15s; }
    .choice:hover{ border-color:var(--pistachio); background:var(--pistachio-soft); }
    .choice.sel{ border-color:var(--pistachio-deep); background:var(--pistachio-soft); box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .choice b{ display:block; font-size:15px; }
    .choice span{ font-size:12.5px; color:var(--muted); }
    .skill-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--pistachio-soft); border:1px solid var(--pistachio); border-radius:99px; padding:6px 10px; font-size:13px; margin:4px; }
    .skill-chip button{ background:none; border:none; cursor:pointer; font-size:14px; }
    .search-results{ border:1px solid var(--line); border-radius:10px; max-height:180px; overflow-y:auto; background:#fff; margin-top:6px; }
    .search-results div{ padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line-soft); }
    .search-results div:hover{ background:var(--pistachio-soft); }
    .nav-row{ display:flex; justify-content:space-between; margin-top:24px; gap:12px; }
    .helper{ font-size:13px; color:var(--muted); margin:6px 0 0; }
  </style>
</head>
<body data-page="student">
  <div id="shell"></div>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script>
  (function(){
    "use strict";
    const page=document.getElementById("page");
    let step=0, data={ status:"", state_id:"", district_id:"", location_text:"", education_level:"", course_program:"", specialization:"", year_semester:"", qualification:"", nsqf_level:"", skills:[], interests:[], preferences:[], goal:"" };
    let states=[], districts=[], allSkills=[];
    const STATUS_OPTS=[
      {id:"School Student", label:"School Student", desc:"Class 8-12"},
      {id:"College Student", label:"College Student", desc:"Undergraduate / Postgraduate"},
      {id:"ITI/Vocational Student", label:"ITI / Vocational", desc:"ITI, Diploma, Vocational"},
      {id:"Working", label:"Working", desc:"Employed, seeking growth"},
      {id:"Looking for a Job", label:"Looking for Job", desc:"Actively job hunting"},
      {id:"Exploring Careers", label:"Exploring Careers", desc:"Discovering options"}
    ];
    const INTERESTS=["Technology","Healthcare","Engineering","Business","Finance","Design","Skilled Trades","Agriculture","Logistics","Manufacturing","Public Services","Other"];
    const PREFS=["Earning Potential","Career Growth","Opportunities Near Me","Technical Work","Working With People","Employment Stability","Emerging Industries","Further Education","Entrepreneurship"];
    const GOALS=["Choose a Career","Get My First Job","Improve My Skills","Find Better Career Options","Prepare for Emerging Field","Find Relevant Training","Understand My Skill Gaps"];
    const PROF_LABELS=["Just Started","Comfortable","Can Apply","Highly Comfortable"];
    const TOTAL=8; // 0-7

    const editId=new URLSearchParams(location.search).get("id");
    async function init(){
      try{
        states=await window.KaushoraAPI.get("/api/meta/states");
        districts=await window.KaushoraAPI.get("/api/meta/districts");
        allSkills=await window.KaushoraAPI.get("/api/meta/skills");
      }catch(e){ /* allow offline wizard but location/skills will be limited */ }
      if(editId){
        try{
          const p=await window.KaushoraAPI.get("/api/student/profile/"+editId);
          Object.assign(data, {
            status:p.status||"", state_id:p.state_id||"", district_id:p.district_id||"",
            location_text:p.location_text||"", education_level:p.education_level||"",
            course_program:p.course_program||"", specialization:p.specialization||"",
            year_semester:p.year_semester||"", qualification:p.qualification||"",
            nsqf_level:p.nsqf_level||"", skills:(p.skills||[]).map(s=>({skill_id:s.skill_id, proficiency_label:s.proficiency_label||"Comfortable"})),
            interests:p.interests||[], preferences:p.preferences||[], goal:p.goal||""
          });
          document.title="Edit Profile #"+editId+" — Kaushora";
        }catch(e){ /* ignore, keep draft */ }
      } else {
        // try restore draft
        try{ const d=JSON.parse(localStorage.getItem("kaushora_profile_draft")||"null"); if(d) Object.assign(data,d); }catch(e){}
      }
      render();
    }

    function saveDraft(){ try{ localStorage.setItem("kaushora_profile_draft", JSON.stringify(data)); }catch(e){} }

    function progress(){
      let h='<div class="progress" aria-label="Progress">';
      for(let i=0;i<TOTAL;i++) h+='<i class="'+(i<step?'done':i===step?'on':'')+'" title="Step '+(i+1)+'"></i>';
      return h+'</div><div style="font-size:12.5px;color:var(--muted);text-align:center">Step '+(step+1)+' of '+TOTAL+' — '+["About You","Education","Skills","Interests","Preferences","Goal","Review","Analysis"][step]+'</div>';
    }

    function render(){
      saveDraft();
      let h=progress();
      h+='<div class="wizard"><div class="step-card">';
      if(step===0) h+=renderAbout();
      else if(step===1) h+=renderEducation();
      else if(step===2) h+=renderSkills();
      else if(step===3) h+=renderInterests();
      else if(step===4) h+=renderPrefs();
      else if(step===5) h+=renderGoal();
      else if(step===6) h+=renderReview();
      else if(step===7) h+=renderDone();
      h+='</div></div>';
      page.innerHTML=h;
      bind();
    }

    function bind(){
      // status cards
      document.querySelectorAll(".choice[data-status]").forEach(el=>el.addEventListener("click",()=>{
        data.status=el.dataset.status; document.querySelectorAll(".choice[data-status]").forEach(c=>c.classList.remove("sel"));
        el.classList.add("sel");
      }));
      // interest/pref/goal toggles
      document.querySelectorAll(".choice[data-interest]").forEach(el=>el.addEventListener("click",()=>{
        const v=el.dataset.interest; const i=data.interests.indexOf(v);
        if(i>=0) data.interests.splice(i,1); else data.interests.push(v);
        el.classList.toggle("sel");
      }));
      document.querySelectorAll(".choice[data-pref]").forEach(el=>el.addEventListener("click",()=>{
        const v=el.dataset.pref; const i=data.preferences.indexOf(v);
        if(i>=0) data.preferences.splice(i,1); else data.preferences.push(v);
        el.classList.toggle("sel");
      }));
      document.querySelectorAll(".choice[data-goal]").forEach(el=>el.addEventListener("click",()=>{
        data.goal=el.dataset.goal; document.querySelectorAll(".choice[data-goal]").forEach(c=>c.classList.remove("sel")); el.classList.add("sel");
      }));
      // skill search
      const inp=document.getElementById("skillSearch");
      if(inp){
        inp.addEventListener("input",()=>{
          const q=inp.value.trim().toLowerCase();
          const box=document.getElementById("skillResults");
          if(!q||q.length<2){ box.innerHTML=""; return; }
          const hits=allSkills.filter(s=>s.skill_name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q)).slice(0,8);
          box.innerHTML=hits.map(s=>'<div data-sid="'+s.id+'" data-name="'+esc(s.skill_name)+'"><b>'+esc(s.skill_name)+'</b> <span style="color:var(--muted);font-size:12px">'+esc(s.id)+' · '+esc(s.skill_category||'')+'</span></div>').join("") || '<div style="color:var(--muted)">No matching skill</div>';
          box.querySelectorAll("div[data-sid]").forEach(d=>d.addEventListener("click",()=>{
            addSkill(d.dataset.sid, d.dataset.name);
            inp.value=""; box.innerHTML="";
          }));
        });
      }
      // nav
      const back=document.getElementById("back"), next=document.getElementById("next");
      if(back) back.addEventListener("click",()=>{ if(step>0){ step--; render(); } });
      if(next) next.addEventListener("click",()=>{ if(validate()){ step++; render(); if(step===7) submit(); } });
      // selects
      const ssel=document.getElementById("stateSel");
      if(ssel) ssel.addEventListener("change",e=>{
        data.state_id=e.target.value;
        const dsel=document.getElementById("districtSel");
        if(dsel){
          const filtered=e.target.value ? districts.filter(d=>d.state_id===e.target.value) : districts;
          dsel.innerHTML='<option value="">Select district</option>'+filtered.map(d=>'<option value="'+d.district_id+'" '+(data.district_id===d.district_id?'selected':'')+'>'+esc(d.district_name)+'</option>').join("");
        }
      });
      const dsel=document.getElementById("districtSel");
      if(dsel) dsel.addEventListener("change",e=>data.district_id=e.target.value);
      // education
      ["education_level","course_program","specialization","year_semester","nsqf_level"].forEach(id=>{
        const el=document.getElementById(id);
        if(el) el.addEventListener("change",e=>data[e.target.id]=e.target.value);
        if(el) el.addEventListener("input",e=>data[e.target.id]=e.target.value);
      });
    }

    function esc(s){ return window.KShell.escapeHtml(s||""); }

    function addSkill(sid, name){
      if(data.skills.find(s=>s.skill_id===sid)) return;
      data.skills.push({skill_id:sid, proficiency_label:"Comfortable"});
      renderSkillsChips();
    }
    function removeSkill(sid){
      data.skills=data.skills.filter(s=>s.skill_id!==sid);
      renderSkillsChips();
    }
    window.removeSkill=removeSkill;
    function renderSkillsChips(){
      const box=document.getElementById("skillChips");
      if(!box) return;
      box.innerHTML=data.skills.map(s=>'<span class="skill-chip">'+esc(s.skill_id)+' · '+esc((allSkills.find(x=>x.id===s.skill_id)||{}).skill_name||s.skill_id)+' <select onchange="(function(v){ var o=data.skills.find(x=>x.skill_id===\''+s.skill_id+'\'); if(o)o.proficiency_label=v; })(this.value)" style="margin-left:6px;border-radius:6px;padding:2px 6px;font-size:12px">'+PROF_LABELS.map(l=>'<option '+(l===s.proficiency_label?'selected':'')+'>'+l+'</option>').join("")+'</select> <button onclick="removeSkill(\''+s.skill_id+'\')" aria-label="Remove">×</button></span>').join("") || '<span style="color:var(--muted);font-size:13px">No skills selected yet.</span>';
    }

    function validate(){
      const err=document.getElementById("err");
      let msg="";
      if(step===0 && !data.status) msg="Please select your current status.";
      if(step===2 && data.skills.length===0) msg="Add at least one skill to continue — you can edit later.";
      if(msg){ if(err) err.textContent=msg; return false; }
      return true;
    }

    function renderAbout(){
      return '<h2 style="margin:0 0 4px">About You</h2><p class="helper">Who are you right now? Pick the closest.</p>'+
        '<div class="choice-grid" style="margin-top:16px">'+STATUS_OPTS.map(o=>'<button class="choice '+(data.status===o.id?'sel':'')+'" data-status="'+esc(o.id)+'"><b>'+esc(o.label)+'</b><span>'+esc(o.desc)+'</span></button>').join("")+'</div>'+
        '<div style="margin-top:18px" class="grid cols-2"><div class="field"><label>State</label><select id="stateSel" class="inline-filter" style="width:100%;padding:10px"><option value="">Select state</option>'+states.map(s=>'<option value="'+s.state_id+'" '+(data.state_id===s.state_id?'selected':'')+'>'+esc(s.state_name)+'</option>').join("")+'</select></div>'+
        '<div class="field"><label>District</label><select id="districtSel" class="inline-filter" style="width:100%;padding:10px"><option value="">Select district</option>'+(states.length?districts.filter(d=>!data.state_id||d.state_id===data.state_id).map(d=>'<option value="'+d.district_id+'" '+(data.district_id===d.district_id?'selected':'')+'>'+esc(d.district_name)+'</option>').join(""):'')+'</select></div></div>'+
        '<div id="err" style="color:#b42318;font-size:13px;margin-top:8px"></div>'+
        '<div class="nav-row"><button class="btn ghost" disabled>Back</button><button id="next" class="btn">Continue →</button></div>';
    }
    function renderEducation(){
      const showCourse = ["College Student","ITI/Vocational Student","Working"].includes(data.status);
      const showYear = ["College Student","ITI/Vocational Student"].includes(data.status);
      return '<h2 style="margin:0 0 4px">Education</h2><p class="helper">Only what applies to you — skip the rest.</p>'+
        '<div class="field"><label>Education level</label><select id="education_level" class="inline-filter" style="width:100%;padding:10px"><option value="">Select</option>'+["10th","12th","Diploma","ITI","Graduate","Post Graduate","Other"].map(v=>'<option '+(data.education_level===v?'selected':'')+'>'+v+'</option>').join("")+'</select></div>'+
        (showCourse?'<div class="field"><label>Course / Program</label><input id="course_program" value="'+esc(data.course_program)+'" placeholder="e.g. B.Com, Fitter, B.Tech" /></div>':'')+
        '<div class="field"><label>Specialization (optional)</label><input id="specialization" value="'+esc(data.specialization)+'" placeholder="e.g. Computer Science, Electrical" /></div>'+
        (showYear?'<div class="field"><label>Year / Semester</label><input id="year_semester" value="'+esc(data.year_semester)+'" placeholder="e.g. 2nd Year" /></div>':'')+
        '<div class="field"><label>NSQF level (if known)</label><select id="nsqf_level" class="inline-filter" style="width:100%;padding:10px"><option value="">Unknown</option><option '+(data.nsqf_level==="3"?'selected':'')+'>3</option><option '+(data.nsqf_level==="3.5"?'selected':'')+'>3.5</option><option '+(data.nsqf_level==="4"?'selected':'')+'>4</option></select></div>'+
        '<div class="nav-row"><button id="back" class="btn ghost">← Back</button><button id="next" class="btn">Continue →</button></div>';
    }
    function renderSkills(){
      // Defer chips rendering to after DOM insertion — use timeout
      setTimeout(renderSkillsChips,0);
      return '<h2 style="margin:0 0 4px">Your Skills</h2><p class="helper">Search and add what you know — even partly. You can mark how comfortable you are.</p>'+
        '<div class="field" style="position:relative"><label>Search skills</label><input id="skillSearch" placeholder="Type e.g. Communication, Plumbing, Data Entry" autocomplete="off" /><div id="skillResults" class="search-results"></div></div>'+
        '<div id="skillChips" style="margin:10px 0"></div>'+
        '<div id="err" style="color:#b42318;font-size:13px"></div>'+
        '<div class="nav-row"><button id="back" class="btn ghost">← Back</button><button id="next" class="btn">Continue →</button></div>';
    }
    function renderInterests(){
      return '<h2 style="margin:0 0 4px">What interests you?</h2><p class="helper">Pick a few — this helps us match sectors.</p>'+
        '<div class="choice-grid">'+INTERESTS.map(v=>'<button class="choice '+(data.interests.includes(v)?'sel':'')+'" data-interest="'+esc(v)+'"><b>'+esc(v)+'</b></button>').join("")+'</div>'+
        '<div class="nav-row"><button id="back" class="btn ghost">← Back</button><button id="next" class="btn">Continue →</button></div>';
    }
    function renderPrefs(){
      return '<h2 style="margin:0 0 4px">What matters to you?</h2><p class="helper">Choose what you value in a career.</p>'+
        '<div class="choice-grid">'+PREFS.map(v=>'<button class="choice '+(data.preferences.includes(v)?'sel':'')+'" data-pref="'+esc(v)+'"><b>'+esc(v)+'</b></button>').join("")+'</div>'+
        '<div class="nav-row"><button id="back" class="btn ghost">← Back</button><button id="next" class="btn">Continue →</button></div>';
    }
    function renderGoal(){
      return '<h2 style="margin:0 0 4px">Your Goal</h2><p class="helper">What are you trying to achieve right now?</p>'+
        '<div class="choice-grid">'+GOALS.map(v=>'<button class="choice '+(data.goal===v?'sel':'')+'" data-goal="'+esc(v)+'"><b>'+esc(v)+'</b></button>').join("")+'</div>'+
        '<div class="nav-row"><button id="back" class="btn ghost">← Back</button><button id="next" class="btn">Review →</button></div>';
    }
    function renderReview(){
      const chips = arr=>arr.length?arr.map(v=>'<span class="pill tag-green">'+esc(v)+'</span>').join(" "):'<span style="color:var(--muted)">None</span>';
      return '<h2 style="margin:0 0 4px">Review</h2><p class="helper">Check everything — tap Edit to jump back.</p>'+
        '<div class="card" style="margin-top:12px"><b>About</b> — '+esc(data.status||"—")+' · '+esc((states.find(s=>s.state_id===data.state_id)||{}).state_name||"")+' / '+esc((districts.find(d=>d.district_id===data.district_id)||{}).district_name||"")+' <a href="#" onclick="step=0;render();return false" style="float:right;font-size:12px">Edit</a></div>'+
        '<div class="card"><b>Education</b> — '+esc(data.education_level||"—")+' · '+esc(data.course_program||"")+' <a href="#" onclick="step=1;render();return false" style="float:right;font-size:12px">Edit</a></div>'+
        '<div class="card"><b>Skills</b> — '+data.skills.map(s=>esc(s.skill_id)+' ('+esc(s.proficiency_label)+')').join(", ")+'<a href="#" onclick="step=2;render();return false" style="float:right;font-size:12px">Edit</a></div>'+
        '<div class="card"><b>Interests</b> — '+chips(data.interests)+' <a href="#" onclick="step=3;render();return false" style="float:right;font-size:12px">Edit</a></div>'+
        '<div class="card"><b>Preferences</b> — '+chips(data.preferences)+' <a href="#" onclick="step=4;render();return false" style="float:right;font-size:12px">Edit</a></div>'+
        '<div class="card"><b>Goal</b> — '+esc(data.goal||"—")+' <a href="#" onclick="step=5;render();return false" style="float:right;font-size:12px">Edit</a></div>'+
        '<div class="nav-row"><button id="back" class="btn ghost">← Back</button><button id="next" class="btn" style="background:var(--pistachio-deep)">Create profile →</button></div>';
    }
    function renderDone(){
      return '<div style="text-align:center;padding:20px"><div style="font-size:40px">✓</div><h2>Saving…</h2><p class="helper">Kaushora is analyzing your profile.</p></div>';
    }

    async function submit(){
      try{
        let newId;
        if(editId){
          const r=await fetch("/api/student/profile/"+editId,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
          const j=await r.json();
          if(!r.ok) throw new Error((j.errors&&j.errors.join("; "))||j.error||"Update failed");
          newId=editId;
        } else {
          const res=await window.KaushoraAPI.post("/api/student/profile", data);
          newId=res.id;
        }
        localStorage.removeItem("kaushora_profile_draft");
        try{ localStorage.setItem("kaushora_last_profile", String(newId)); }catch(e){}
        location.href="student.html?id="+newId;
      }catch(e){
        page.innerHTML='<div class="step-card"><h2>Could not save</h2><p style="color:#b42318">'+esc(e.message)+'</p><p class="helper">Check required fields and try again.</p><div class="nav-row"><button onclick="step=6;render()" class="btn ghost">← Back to review</button></div></div>';
      }
    }

    init();
  })();
  </script>
</body>
</html>
