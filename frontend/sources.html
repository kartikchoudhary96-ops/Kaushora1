<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sources & Methodology — Kaushora</title>
  <link rel="stylesheet" href="css/design.css" />
</head>
<body data-page="sources">
  <div id="shell"></div>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script>
  (function(){
    "use strict";
    const page=document.getElementById("page");
    async function load(){
      page.innerHTML='<div class="eyebrow">Evidence & provenance</div><h1 class="title">Sources & Methodology</h1><div class="card"><div class="skel" style="height:200px"></div></div>';
      try{
        const [ds, srcs]=await Promise.all([window.KaushoraAPI.get("/api/data/status").then(r=>r.data), window.KaushoraAPI.get("/api/evidence")]);
        render(ds, srcs.data||srcs);
      }catch(e){ page.innerHTML=window.KShell.errorState(e.message,"reload"); window.reload=()=>load(); }
    }
    function render(ds, evidence){
      let h='<div class="eyebrow">Evidence & provenance</div><h1 class="title">Sources & Methodology</h1><p class="subtitle">Every figure traces to a public record or a documented derivation.</p>';
      h+='<h2 class="section">Data sources (10)</h2><p class="section-sub">Registered provenance for every record.</p><div class="grid cols-2">';
      // sources table is in dataset_meta, but we have evidence with source refs; fetch sources via data/status methodology
      const meta=ds.methodology||[];
      h+='<div class="card" style="grid-column:1/-1"><div class="table-wrap"><table class="data"><thead><tr><th>Source</th><th>Publisher</th><th>Coverage</th></tr></thead><tbody>'+
        meta.slice(0,10).map(m=>'<tr><td><b>'+esc(m.section||"")+'</b><br><span style="font-size:12px;color:var(--muted)">'+esc(m.methodology_note||"")+'</span></td><td>'+esc(m.status||"")+'</td><td>'+(m.record_count||0)+'</td></tr>').join("")+
        '</tbody></table></div></div></div>';
      h+='<h2 class="section">Observed vs Derived</h2><div class="grid cols-2"><div class="card"><h3>Observed (source data)</h3><p class="hint">Directly published: PLFS indicators, NSDC QP codes, PMKVY centre counts, ITI courses, evidence metrics. Labelled <span class="pill tag-green">Source data</span>.</p></div>'+
        '<div class="card"><h3>Derived (Kaushora)</h3><p class="hint">Calculated: alignment scores, career matches, gap prioritization, recommendations. Labelled <span class="pill tag-amber">Derived by Kaushora</span> with formula.</p></div></div>';
      h+='<h2 class="section">Citable evidence metrics (10)</h2><div class="grid cols-3">'+evidence.slice(0,6).map(e=>'<div class="card kpi"><div class="k-label">'+esc(e.metric_name)+'</div><div class="k-value" style="font-size:20px">'+esc(e.metric_value)+' '+(e.unit||"")+'</div><div class="k-sub">'+esc(e.geography||"")+' · '+esc(e.time_period||"")+'</div><span class="k-tag tag-green">Source data</span></div>').join("")+'</div>';
      h+='<h2 class="section">Limitations (honest)</h2><div class="card"><ul style="margin:0;padding-left:20px;font-size:13px;color:var(--muted)">'+
        '<li>Per-skill demand: unpublished → <b>Insufficient data</b>, never estimated.</li>'+
        '<li>District demand/PLFS: state/national only — never downscaled.</li>'+
        '<li>Placements/seats: mostly unpublished (NULL).</li>'+
        '<li>Explicit skill links: 4/32 occupations — rest unscored.</li>'+
        '</ul></div>';
      h+='<div class="evidence-strip">'+window.KIcon("shield")+'<div><b>Traceability.</b> Every analytical output links to its source row(s) via <code>source_id</code> and is reproducible from the CSV dataset + deterministic code. No synthetic rows exist.</div></div>';
      page.innerHTML=h;
    }
    function esc(s){ return window.KShell.escapeHtml(s); }
    load();
  })();
  </script>
</body>
</html>
